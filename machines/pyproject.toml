[dependency-groups]
main = [
    "boto3~=1.28",
    "charm-refresh~=3.1.1",
    "charmlibs-interfaces-tls-certificates~=1.8",
    "charmlibs-rollingops~=1.0",
    "jinja2~=3.1",
    "object-storage-charmlib~=1.0.0",
    "ops[tracing]~=3.5",
    "python_hosts~=1.1",
    "pyyaml~=6.0",
    "tenacity~=8.2",
    "tomli~=2.3",
    "typing_extensions~=4.15",
]
charm-libs = [
    # data_platform_libs/v0/data_interfaces.py
    "ops>=2.23.2",
    # data_platform_libs/v1/data_models.py
    "pydantic~=2.13",
    # grafana_agent/v0/cos_agent.py
    "cosl>=0.1.1",
    # mysql/v0/*.py"
    "charm-refresh~=3.1.1",
    "mysql_shell_client~=0.9",
    # tls_certificates_interface/v2/tls_certificates.py
    "cryptography>=42.0.8",
    "jsonschema",
]
format = [
    "ruff~=0.12",
]
lint = [
    "ruff~=0.15",
    "codespell~=2.4",
    "shellcheck-py~=0.11.0",
]
unit = [
    "pytest~=9.0",
    "pytest-mock~=3.15",
    "coverage[toml]~=7.14",
    "parameterized~=0.9.0",
]
integration = [
    "pytest~=9.0",
    "juju~=3.6",
    "mysql-connector-python~=9.7",
    "tenacity~=8.5",
    "boto3~=1.43",
    "pyyaml~=6.0",
    "urllib3~=2.0",
    "allure-pytest~=2.16",
    "allure-pytest-default-results~=0.1.4",
    "jubilant~=1.9.0",
    "tomli~=2.4",
    "tomli-w~=1.2",
]
build-refresh-version = [
    "charm-refresh-build-version~=0.4.1"
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.2.0"

[tool.poetry.dependencies]
python = "^3.12"
# This is mandatory to make charmcraftlocal trigger the tagging behavior.
# https://github.com/canonical/charmcraftlocal/blob/v0.3.4/charmcraftlocal/_main.py#L259
common = {path = "../common", develop = true}

[tool.poetry.group.format]
optional = true

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.build-refresh-version]
optional = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Linting tools configuration
[tool.ruff]
# preview and explicit preview are enabled for CPY001
preview = true
target-version = "py312"
src = ["src", "."]
line-length = 99

[tool.ruff.lint]
explicit-preview-rules = true
select = [
  "A",
  "E",
  "W",
  "F",
  "C",
  "N",
  "D",
  "I",
  "B",
  "CPY001",
  "RUF",
  "S",
  "SIM",
  "UP",
  "TC",
]
ignore = [
  "D107", # Ignore D107 Missing docstring in __init__
  "E501", # Ignore E501 Line too long
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D1",
  "D417",
  # Asserts
  "B011",
  # Disable security checks for tests
  "S",
]

[tool.ruff.lint.flake8-copyright]
# Check for properly formatted copyright header in each file
author = "Canonical Ltd."
notice-rgx = "Copyright\\s\\d{4}([-,]\\d{4})*\\s+"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"
